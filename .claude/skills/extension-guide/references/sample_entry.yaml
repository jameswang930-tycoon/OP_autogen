# Extension primitive entry — SAMPLE / TEMPLATE.
#
# This is a public-form illustrative example (NOT a real primitive). It exists so the
# confidential-env GLM 4.7 has a concrete format to copy. Replace the content with real
# primitives there; do NOT ship real primitive semantics to the public branch.
#
# Required fields: name / semantics / signature / category / example / pitfalls.
# `category` MUST be a bottleneck category id from control/vocabulary.yaml
# (enforced by control/check_extension_cheatsheet.py).

name: sample_async_copy_template
semantics: >
  Illustrative async / bulk copy that overlaps a memory transfer with compute. Public-form
  placeholder only — not a real primitive.
signature: async_copy(dst, src, shape, stride)   # illustrative; replace with the real signature
category: memory_underfilled
# 可选字段（GLM52 优化指导第二部分：让原语呈现带"模块归属 + 适用场景"，减少幻觉与误用）：
module: ext_copy                          # 模块归属 → 索引渲染成全限定名 ext_copy.<name>，杜绝模型猜模块
applies_to: [matmul, conv]                # 适用场景 → 仅这些算子检索时才可见；缺省=通用（不据此隐藏）
example: |
  # example MUST be a complete, compilable minimal kernel (not a snippet). Replace the
  # illustrative call below with the real primitive; keep the full kernel skeleton.
  import triton
  import triton.language as tl

  @triton.jit
  def copy_kernel(out_ptr, in_ptr, N, BLOCK: tl.constexpr):
      pid = tl.program_id(0)
      offs = pid * BLOCK + tl.arange(0, BLOCK)
      mask = offs < N
      x = tl.load(in_ptr + offs, mask=mask)
      # illustrative async/bulk-copy-flavored load — replace with the real primitive call
      tl.store(out_ptr + offs, x, mask=mask)
pitfalls:
  - must issue the copy early enough to overlap; issued too late there is nothing to hide
  - watch the staging buffer size — oversubscription spills and negates the gain
  - a copy that the dependency chain immediately waits on gives zero overlap
